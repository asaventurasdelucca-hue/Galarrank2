name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1
      - name: Baixar o Cobblemon 1.8.2 (so para compilar)
        run: |
          mkdir -p libs
          URL=$(curl -s -A "galarrank-build" "https://api.modrinth.com/v2/project/cobblemon/version" | jq -r '.[].files[] | select(.filename=="Cobblemon-neoforge-1.8.2+1.21.1.jar") | .url' | head -1)
          echo "URL: $URL"
          test -n "$URL"
          curl -L -A "galarrank-build" -o libs/cobblemon.jar "$URL"
          ls -la libs
      - name: Compilar
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Conferir que o jar tem o mod de verdade
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          echo "Jar: $JAR"
          unzip -l "$JAR"
          unzip -l "$JAR" | grep -q "META-INF/neoforge.mods.toml"
          unzip -l "$JAR" | grep -q "dev/galar/rank/GalarRank.class"
      - name: Guardar o log do build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Guardar o jar
        uses: actions/upload-artifact@v4
        with:
          name: galarrank-jar
          path: build/libs/*.jar
