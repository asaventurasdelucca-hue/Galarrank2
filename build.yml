name: Build GalarRank

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galarrank-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Download Cobblemon 1.8.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p libs

          URL="$(curl --fail --silent --show-error --location --retry 3 \
            -A 'galarrank-build' \
            'https://api.modrinth.com/v2/project/cobblemon/version' \
            | jq -er '[.[] | .files[] | select(.filename == "Cobblemon-neoforge-1.8.2+1.21.1.jar")][0].url')"

          echo "Cobblemon download URL found."
          curl --fail --show-error --location --retry 3 \
            -A 'galarrank-build' \
            "$URL" -o libs/cobblemon.jar

          test -s libs/cobblemon.jar
          file libs/cobblemon.jar

      - name: Build mod
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Verify generated mod JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"

          test -n "$JAR"
          echo "Checking: $JAR"
          jar tf "$JAR" > jar-contents.txt

          grep -qx 'META-INF/neoforge.mods.toml' jar-contents.txt
          grep -qx 'dev/galar/rank/GalarRank.class' jar-contents.txt

          echo "JAR verification passed."

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galarrank-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload compiled mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: galarrank-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
